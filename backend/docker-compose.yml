version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: socialpilot_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-socialpilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MongoDB Document Database Service (for analytics & logs)
  mongodb:
    image: mongo:7.0
    container_name: socialpilot_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Redis In-Memory Store (for Celery background tasks & caching)
  redis:
    image: redis:7-alpine
    container_name: socialpilot_redis
    restart: always
    ports:
      - "6379:6379"

  # FastAPI Backend Service
  backend:
    build: .
    container_name: socialpilot_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/socialpilot
      - SECRET_KEY=socialpilot_super_secret_jwt_key_change_in_production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
